<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusSync — The OS for Modern Campuses</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0A0E1A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React + Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        body {
            background-color: #0A0E1A;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-panel:hover {
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Neon utilities */
        .text-glow {
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.5);
        }
        
        .btn-neon {
            background: linear-gradient(135deg, #9333ea, #3b82f6);
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.4), inset 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .btn-neon:hover {
            box-shadow: 0 0 50px rgba(147, 51, 234, 0.7), inset 0 0 15px rgba(255,255,255,0.4);
            transform: translateY(-3px) scale(1.02);
        }

        /* Grid Background */
        .bg-grid {
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0A0E1A; }
        ::-webkit-scrollbar-thumb { background: rgba(147, 51, 234, 0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(147, 51, 234, 0.5); }
        
        ::selection { background: rgba(147, 51, 234, 0.4); color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

        // --- ICONS (Lucide style) ---
        const IconArrowRight = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconCheck = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        );
        const IconDollar = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        );
        const IconClock = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const IconShield = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        );
        const IconUsers = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const IconChevronDown = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        );
        const IconMenu = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        );
        const IconX = ({ className="w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );

        // --- COMPONENTS ---

        const NavBar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <motion.nav 
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                    className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'glass-panel border-x-0 border-t-0 py-3' : 'bg-transparent py-5'}`}
                >
                    <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center shadow-lg shadow-purple-500/30 font-bold text-lg">
                                C
                            </div>
                            <span className="text-xl font-bold tracking-tight">Campus<span className="text-purple-400">Sync</span></span>
                        </div>
                        
                        <div className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                            <a href="#features" className="hover:text-white transition-colors">Features</a>
                            <a href="#roles" className="hover:text-white transition-colors">Roles</a>
                            <a href="#roi" className="hover:text-white transition-colors">ROI</a>
                            <a href="#faq" className="hover:text-white transition-colors">FAQ</a>
                        </div>
                        
                        <div className="hidden md:block">
                            <button className="btn-neon text-white text-sm font-bold px-6 py-2.5 rounded-2xl">
                                Book a Demo
                            </button>
                        </div>

                        <button className="md:hidden text-white" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                            {mobileMenuOpen ? <IconX /> : <IconMenu />}
                        </button>
                    </div>

                    <AnimatePresence>
                        {mobileMenuOpen && (
                            <motion.div 
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                className="md:hidden glass-panel border-x-0 border-b-0 mt-3 flex flex-col px-6 py-4 gap-4"
                            >
                                <a href="#features" onClick={() => setMobileMenuOpen(false)} className="text-slate-300 hover:text-white font-medium">Features</a>
                                <a href="#roles" onClick={() => setMobileMenuOpen(false)} className="text-slate-300 hover:text-white font-medium">Roles</a>
                                <a href="#roi" onClick={() => setMobileMenuOpen(false)} className="text-slate-300 hover:text-white font-medium">ROI</a>
                                <a href="#faq" onClick={() => setMobileMenuOpen(false)} className="text-slate-300 hover:text-white font-medium">FAQ</a>
                                <button className="btn-neon text-white text-sm font-bold px-6 py-3 rounded-xl w-full mt-2">
                                    Book a Demo
                                </button>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </motion.nav>
            );
        };

        
        const InteractivePhone = () => {
            const [activeScreen, setActiveScreen] = useState('home');

            const ScreenWrapper = ({ children, title }) => (
                <motion.div 
                    initial={{ x: '100%', opacity: 0 }}
                    animate={{ x: 0, opacity: 1 }}
                    exit={{ x: '-100%', opacity: 0 }}
                    transition={{ type: 'spring', damping: 25, stiffness: 200 }}
                    className="absolute inset-0 bg-gradient-to-b from-[#0f152a] to-[#0A0E1A] flex flex-col pt-8 z-40"
                >
                    <div className="flex items-center px-4 pb-4 border-b border-white/5 mt-4">
                        <button onClick={() => setActiveScreen('home')} className="p-2 -ml-2 text-slate-400 hover:text-white">
                            <IconChevronDown className="w-5 h-5 rotate-90" />
                        </button>
                        <h4 className="font-bold text-white ml-2 flex-1">{title}</h4>
                    </div>
                    <div className="flex-1 overflow-y-auto hide-scrollbar p-4">
                        {children}
                    </div>
                </motion.div>
            );

            return (
                <motion.div 
                    initial={{ opacity: 0, y: 100 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ duration: 1, ease: [0.16, 1, 0.3, 1], delay: 0.6 }}
                    className="mt-24 relative w-full max-w-[340px] mx-auto z-20"
                >
                    <div className="aspect-[9/19] rounded-[3rem] glass-panel p-2 shadow-[0_0_100px_rgba(168,85,247,0.2)] bg-gradient-to-b from-white/20 to-white/5">
                        <div className="w-full h-full rounded-[2.5rem] bg-[#0A0E1A] border border-white/10 flex flex-col overflow-hidden relative">
                            {/* Phone Notch */}
                            <div className="absolute top-0 inset-x-0 h-7 flex justify-center z-50">
                                <div className="w-24 h-full bg-black rounded-b-2xl"></div>
                            </div>
                            
                            <AnimatePresence mode="wait">
                                {activeScreen === 'home' && (
                                    <motion.div 
                                        key="home"
                                        initial={{ opacity: 0 }}
                                        animate={{ opacity: 1 }}
                                        exit={{ scale: 0.95, opacity: 0 }}
                                        transition={{ duration: 0.2 }}
                                        className="absolute inset-0 flex flex-col p-5 pt-12 gap-4 bg-gradient-to-b from-[#0f152a] to-[#0A0E1A]"
                                    >
                                        {/* Header */}
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-2">
                                                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center text-xs font-bold text-white">JD</div>
                                                <div>
                                                    <p className="text-[10px] text-slate-400">Good Morning</p>
                                                    <p className="text-xs font-bold text-white">John Doe</p>
                                                </div>
                                            </div>
                                            <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
                                                <IconCheck className="w-4 h-4 text-purple-400" />
                                            </div>
                                        </div>
                                        
                                        {/* Quick Stats Card */}
                                        <div className="rounded-2xl bg-gradient-to-r from-purple-600/20 to-blue-600/20 border border-purple-500/20 p-4">
                                            <p className="text-white/60 text-[10px] uppercase tracking-wider mb-1">Total Attendance</p>
                                            <div className="flex items-end justify-between">
                                                <p className="text-2xl font-bold text-white">85.4%</p>
                                                <p className="text-[10px] text-green-400 bg-green-400/10 px-2 py-0.5 rounded-full">+2% this week</p>
                                            </div>
                                        </div>
                                        
                                        {/* Actions Grid */}
                                        <div className="grid grid-cols-2 gap-3 mt-1">
                                            <div onClick={() => setActiveScreen('attendance')} className="bg-white/5 rounded-xl p-3 flex flex-col items-center justify-center gap-2 border border-white/5 hover:bg-white/10 transition-colors cursor-pointer">
                                                <IconCheck className="w-6 h-6 text-purple-400" />
                                                <p className="text-[10px] font-medium text-slate-300">Attendance</p>
                                            </div>
                                            <div onClick={() => setActiveScreen('timetable')} className="bg-white/5 rounded-xl p-3 flex flex-col items-center justify-center gap-2 border border-white/5 hover:bg-white/10 transition-colors cursor-pointer">
                                                <IconClock className="w-6 h-6 text-blue-400" />
                                                <p className="text-[10px] font-medium text-slate-300">Timetable</p>
                                            </div>
                                            <div onClick={() => setActiveScreen('assignment')} className="bg-white/5 rounded-xl p-3 flex flex-col items-center justify-center gap-2 border border-white/5 hover:bg-white/10 transition-colors cursor-pointer">
                                                <IconUsers className="w-6 h-6 text-pink-400" />
                                                <p className="text-[10px] font-medium text-slate-300">Assignment</p>
                                            </div>
                                            <div onClick={() => setActiveScreen('idcard')} className="bg-white/5 rounded-xl p-3 flex flex-col items-center justify-center gap-2 border border-white/5 hover:bg-white/10 transition-colors cursor-pointer">
                                                <IconShield className="w-6 h-6 text-green-400" />
                                                <p className="text-[10px] font-medium text-slate-300">ID Card</p>
                                            </div>
                                        </div>
                                        
                                        {/* Next Class */}
                                        <div className="mt-2 flex-1 bg-white/5 rounded-t-2xl border border-white/5 border-b-0 p-4 relative overflow-hidden">
                                            <div className="absolute -top-4 -right-4 w-16 h-16 bg-purple-500/20 blur-xl rounded-full"></div>
                                            <p className="text-[10px] text-slate-400 font-medium mb-2">Upcoming Class</p>
                                            <div className="flex items-center gap-3">
                                                <div className="w-1.5 h-8 bg-purple-500 rounded-full"></div>
                                                <div>
                                                    <p className="text-sm font-bold text-white">Data Structures</p>
                                                    <p className="text-[10px] text-slate-400">09:00 AM - Room 402</p>
                                                </div>
                                            </div>
                                        </div>
                                    </motion.div>
                                )}

                                {activeScreen === 'attendance' && (
                                    <ScreenWrapper key="attendance" title="Live Attendance">
                                        <div className="bg-purple-500/10 border border-purple-500/20 rounded-2xl p-4 mb-4 text-center">
                                            <div className="w-16 h-16 rounded-full bg-purple-500/20 mx-auto flex items-center justify-center mb-2 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                                                <p className="text-2xl font-bold text-white">85%</p>
                                            </div>
                                            <p className="text-[10px] text-purple-400 uppercase tracking-wide">Overall Attendance</p>
                                        </div>
                                        <div className="space-y-2">
                                            {[
                                                {s:'Data Structures', a:'92%', c:'text-green-400'},
                                                {s:'DBMS', a:'78%', c:'text-yellow-400'},
                                                {s:'Operating Systems', a:'65%', c:'text-red-400'}
                                            ].map((sub, i) => (
                                                <div key={i} className="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 hover:bg-white/10 transition-colors">
                                                    <span className="text-sm font-medium text-slate-200">{sub.s}</span>
                                                    <span className={`text-xs font-bold ${sub.c}`}>{sub.a}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </ScreenWrapper>
                                )}

                                {activeScreen === 'timetable' && (
                                    <ScreenWrapper key="timetable" title="Timetable">
                                        <div className="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-2">
                                            {['Mon','Tue','Wed','Thu','Fri'].map((d,i) => (
                                                <div key={i} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${i===0 ? 'bg-blue-500 text-white' : 'bg-white/5 text-slate-400'}`}>{d}</div>
                                            ))}
                                        </div>
                                        <div className="space-y-3">
                                            {[
                                                {t:'09:00 AM', s:'Data Structures', r:'Room 402', c:'purple'},
                                                {t:'11:00 AM', s:'DBMS', r:'Room 101', c:'blue'},
                                                {t:'02:00 PM', s:'OS Lab', r:'Lab 3', c:'pink'},
                                            ].map((cls, i) => (
                                                <div key={i} className="bg-white/5 rounded-xl p-3 border border-white/5 flex gap-3">
                                                    <div className="text-[10px] text-slate-400 font-medium w-12 pt-0.5">{cls.t}</div>
                                                    <div className="flex-1">
                                                        <p className="text-sm font-bold text-white">{cls.s}</p>
                                                        <p className="text-[10px] text-slate-500">{cls.r}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </ScreenWrapper>
                                )}

                                {activeScreen === 'assignment' && (
                                    <ScreenWrapper key="assignment" title="Assignments">
                                        <div className="space-y-3">
                                            {[
                                                {t:'Binary Trees Implementation', s:'Data Structures', d:'Today, 11:59 PM', stat:'Pending', c:'red'},
                                                {t:'SQL Queries Practise', s:'DBMS', d:'Tomorrow', stat:'Submitted', c:'green'},
                                                {t:'CPU Scheduling Algos', s:'OS', d:'28 Aug', stat:'Graded', c:'blue'},
                                            ].map((ass, i) => (
                                                <div key={i} className="bg-white/5 rounded-xl p-3 border border-white/5 hover:bg-white/10 transition-colors">
                                                    <div className="flex justify-between mb-1">
                                                        <span className="text-[10px] text-slate-400">{ass.s}</span>
                                                        <span className={`text-[10px] text-${ass.c}-400 bg-${ass.c}-400/10 px-2 rounded-full`}>{ass.stat}</span>
                                                    </div>
                                                    <p className="text-sm font-bold text-white mb-2">{ass.t}</p>
                                                    <p className="text-[10px] text-slate-500 flex items-center gap-1">
                                                        <IconClock className="w-3 h-3" /> Due: {ass.d}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </ScreenWrapper>
                                )}

                                {activeScreen === 'idcard' && (
                                    <ScreenWrapper key="idcard" title="Digital ID">
                                        <div className="bg-gradient-to-br from-[#1a1f35] to-[#0A0E1A] rounded-2xl border border-white/10 p-5 mt-4 shadow-xl relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 blur-2xl rounded-full -mr-10 -mt-10"></div>
                                            <div className="text-center mb-6 relative z-10">
                                                <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-purple-500 to-blue-500 p-1 mb-3">
                                                    <div className="w-full h-full rounded-full bg-[#0A0E1A] flex items-center justify-center text-2xl font-bold text-white">JD</div>
                                                </div>
                                                <h3 className="text-lg font-bold text-white">John Doe</h3>
                                                <p className="text-xs text-purple-400">B.Tech Computer Science</p>
                                            </div>
                                            <div className="space-y-2 text-xs relative z-10">
                                                <div className="flex justify-between border-b border-white/5 pb-1">
                                                    <span className="text-slate-500">Roll No</span>
                                                    <span className="text-slate-200 font-medium">CS24001</span>
                                                </div>
                                                <div className="flex justify-between border-b border-white/5 pb-1">
                                                    <span className="text-slate-500">DOB</span>
                                                    <span className="text-slate-200 font-medium">12 Aug 2004</span>
                                                </div>
                                                <div className="flex justify-between pb-1">
                                                    <span className="text-slate-500">Valid Till</span>
                                                    <span className="text-slate-200 font-medium">May 2028</span>
                                                </div>
                                            </div>
                                            <div className="mt-6 h-12 bg-white/10 rounded flex items-center justify-center px-4 overflow-hidden">
                                                 {/* Fake barcode */}
                                                 <div className="flex gap-0.5 w-full h-8">
                                                     {Array.from({length: 40}).map((_, i) => (
                                                         <div key={i} className="bg-white/50 h-full" style={{width: Math.random() * 4 + 1 + 'px'}}></div>
                                                     ))}
                                                 </div>
                                            </div>
                                        </div>
                                    </ScreenWrapper>
                                )}
                            </AnimatePresence>
                        </div>
                    </div>
                </motion.div>
            );
        };


        const Hero = () => {
            const { scrollY } = useScroll();
            const y1 = useTransform(scrollY, [0, 1000], [0, 200]);
            const opacity = useTransform(scrollY, [0, 500], [1, 0]);

            return (
                <section className="relative min-h-[100svh] flex flex-col items-center justify-center pt-32 pb-20 overflow-hidden">
                    <div className="absolute inset-0 bg-grid pointer-events-none [mask-image:radial-gradient(ellipse_at_center,black,transparent_70%)] opacity-40" />
                    
                    {/* Glow Orbs */}
                    <div className="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none -translate-x-1/2 -translate-y-1/2 mix-blend-screen" />
                    <div className="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none translate-x-1/4 translate-y-1/4 mix-blend-screen" />
                    
                    <motion.div 
                        style={{ y: y1, opacity }}
                        initial={{ opacity: 0, y: 50 }}
                        animate={{ opacity: 1, y: 0 }}
                        transition={{ duration: 1, ease: [0.16, 1, 0.3, 1], delay: 0.2 }}
                        className="relative z-10 text-center px-6 max-w-5xl mx-auto flex flex-col items-center"
                    >
                        <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel text-sm text-purple-300 mb-8 font-medium">
                            <span className="w-2 h-2 rounded-full bg-purple-500 animate-pulse" />
                            Multi-Tenant College Management Platform
                        </div>
                        
                        <h1 className="text-5xl md:text-7xl lg:text-[80px] font-extrabold tracking-tighter mb-8 text-glow leading-[1.1]">
                            The OS for <br />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-purple-300 to-blue-400">Modern Campuses.</span>
